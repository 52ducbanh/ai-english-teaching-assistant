version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: english_assistant_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: english_assistant_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: english_assistant_server
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=english_assistant_db
      - DB_SYNCHRONIZE=true
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: english_assistant_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  db_data:
