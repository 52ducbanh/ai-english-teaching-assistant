name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GEMINI_API_KEY,DB_PASSWORD
          script: |
            # Check if directory exists, if not clone it
            if [ ! -d "ai-english-teaching-assistant" ]; then
              git clone https://github.com/52ducbanh/ai-english-teaching-assistant.git
            fi
            
            cd ai-english-teaching-assistant
            
            # Reset any local changes and pull latest code
            git reset --hard
            git pull origin main
            
            # Create the .env file with secrets from GitHub
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            
            # Build and deploy with Docker Compose
            docker-compose up -d --build
