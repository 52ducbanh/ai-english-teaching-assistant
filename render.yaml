services:
  # ── Backend (NestJS API) ──
  - type: web
    name: english-assistant-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SYNCHRONIZE
        value: true
      - key: DB_SSL
        value: true
      - key: GEMINI_API_KEY
        sync: false

  # ── Frontend (React/Vite) ──
  - type: web
    name: english-assistant-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: english-assistant-api
          property: host
